  summary: >
    Computer Science MSc student at ETH Zurich, focused on program verification,
    automated reasoning, and computer vision (major in Secure and Reliable
    Systems, minor in Computer Vision). My Bachelor's thesis built a Rust frontend
    for the GenMC stateless model checker, and I have since worked with the same
    group (ARV) on its consistency checker. I am currently a research intern at NUS's
    VERSE Lab on LTL model checking, following a computer vision internship
    on video-based industrial defect detection. My work has centred on reasoning
    over concurrent and distributed behaviour, and on the compiler toolchains
    verification runs through. High-performance computing is a side interest I follow
    through coursework. What draws me to a problem is when
    the theory has to hold up against a real workload.

